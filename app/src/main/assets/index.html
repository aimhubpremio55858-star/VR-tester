<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>VR BOX MR</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- Câmera / realidade mista -->
    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <!-- Fundo da interface -->
    <div id="vr-background"></div>

    <!-- Menu 3D -->
    <main id="menu">

        <header>
            <div class="logo">
                🥽 <strong>VR BOX</strong>
            </div>

            <div class="status">
                3DoF · MR
            </div>
        </header>

        <section class="welcome">
            <h1>Bem-vindo 👋</h1>
            <p>Seu espaço virtual</p>
        </section>

        <section class="apps">

            <button class="app"
                    onclick="abrirYouTube()">
                <span>▶️</span>
                <label>YouTube</label>
            </button>

            <button class="app"
                    onclick="abrirJogos()">
                <span>🎮</span>
                <label>Jogos</label>
            </button>

            <button class="app"
                    onclick="abrirNavegador()">
                <span>🌐</span>
                <label>Navegador</label>
            </button>

            <button class="app"
                    onclick="abrirVideos()">
                <span>🎬</span>
                <label>Vídeos</label>
            </button>

            <button class="app"
                    onclick="abrirMusica()">
                <span>🎵</span>
                <label>Música</label>
            </button>

            <button class="app"
                    onclick="abrirConfiguracoes()">
                <span>⚙️</span>
                <label>Configurações</label>
            </button>

        </section>

        <section id="hand-status">
            ✋ Hand Tracking: aguardando
        </section>

        <button id="camera-button"
                onclick="iniciarCamera()">
            📷 Ativar câmera / MR
        </button>

    </main>

    <script src="app.js"></script>

</body>
              </html>

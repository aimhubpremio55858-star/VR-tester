<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>MR & Hand Tracking</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene webxr="requiredFeatures: hand-tracking;">
        <a-sky color="#0b0b1a"></a-sky>

        <!-- Objeto central -->
        <a-box id="meuObjeto" 
               position="0 1.5 -2" 
               rotation="0 45 0" 
               color="#4CC3D9" 
               scale="0.4 0.4 0.4">
        </a-box>

        <!-- Câmera -->
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <!-- Mãos -->
        <a-entity hand-tracking-controls="hand: left;"></a-entity>
        <a-entity hand-tracking-controls="hand: right;" interacao-mao></a-entity>
    </a-scene>

    <script>
        AFRAME.registerComponent('interacao-mao', {
            init: function () {
                const objeto = document.querySelector('#meuObjeto');

                this.el.addEventListener('pinchstarted', function () {
                    const cores = ["#EF2D5E", "#FFC65D", "#4CC3D9", "#7BC8A4", "#9b59b6"];
                    const novaCor = cores[Math.floor(Math.random() * cores.length)];
                    objeto.setAttribute('color', novaCor);
                });
            }
        });
    </script>
</body>
</html>

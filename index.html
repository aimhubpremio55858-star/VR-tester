<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App VR no GitHub</title>
    <!-- Carrega a biblioteca A-Frame para Realidade Virtual -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Céu com cor de fundo -->
        <a-sky color="#1a1a2e"></a-sky>

        <!-- Formas 3D no espaço virtual -->
        <!-- Caixa Vermelha -->
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#e94560"></a-box>

        <!-- Esfera Azul -->
        <a-sphere position="1 1.2 -4" radius="0.7" color="#0f3460"></a-sphere>

        <!-- Cilindro Amarelo -->
        <a-box position="0 0.5 -5" rotation="0 0 0" color="#f9ed69" scale="2 0.1 2"></a-box>

        <!-- Câmera do usuário (olhar ao redor) -->
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
</body>
</html>

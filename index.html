<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>App MR & Hand Tracking</title>
    <!-- Carrega o A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Ambiente / Céu para Realidade Mista -->
        <a-sky color="#0b0b1a"></a-sky>

        <!-- Objeto interativo 3D no centro -->
        <a-box id="meuObjeto" position="0 1.5 -2" rotation="0 45 0" color="#4CC3D9" scale="0.4 0.4 0.4"></a-box>

        <!-- Câmera do usuário -->
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <!-- Rastreamento da Mão Esquerda -->
        <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
        
        <!-- Rastreamento da Mão Direita com script de interação -->
        <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;" interacao-mao></a-entity>
    </a-scene>

    <!-- Código JavaScript para lógica de Hand Tracking e Gestos -->
    <script>
        // Registra um componente customizado no A-Frame para detectar os gestos da mão
        AFRAME.registerComponent('interacao-mao', {
            init: function () {
                const el = this.el;
                const objeto3D = document.querySelector('#meuObjeto');

                // Evento disparado quando o usuário faz o gesto de pinça (juntar o dedão com o indicador)
                el.addEventListener('pinchstarted', function (evt) {
                    console.log('Pinça iniciada!');
                    // Muda a cor do cubo aleatoriamente ao fazer o gesto com a mão
                    const cores = ["#EF2D5E", "#FFC65D", "#4CC3D9", "#7BC8A4", "#9b59b6"];
                    const corAleatoria = cores[Math.floor(Math.random() * cores.length)];
                    objeto3D.setAttribute('color', corAleatoria);
                });

                el.addEventListener('pinchended', function (evt) {
                    console.log('Pinça finalizada!');
                });
            }
        });
    </script>
</body>
</html>

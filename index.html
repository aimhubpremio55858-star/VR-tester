<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>App AR MR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

    <!-- O AR-Mode está configurado aqui. O atributo 'ar-mode' força a compatibilidade -->
    <a-scene webxr="requiredFeatures: hit-test, hand-tracking, local-floor;" ar-mode>
        
        <a-entity camera position="0 1.6 0"></a-entity>

        <a-box id="meuObjeto" 
               position="0 1 -2" 
               color="#4CC3D9" 
               scale="0.2 0.2 0.2">
        </a-box>

        <!-- Hand tracking -->
        <a-entity hand-tracking-controls="hand: left;"></a-entity>
        <a-entity hand-tracking-controls="hand: right;"></a-entity>
        
    </a-scene>

</body>
</html>

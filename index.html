<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Mixed Reality Tester</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importação do A-Frame para WebXR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

    <a-scene webxr="requiredFeatures: hand-tracking, hit-test, passthrough;">
        <!-- Controladores de Rastreamento de Mãos -->
        <a-entity id="leftHand" hand-tracking-controls="hand: left"></a-entity>
        <a-entity id="rightHand" hand-tracking-controls="hand: right"></a-entity>

        <!-- Objeto interativo no espaço misto -->
        <a-box id="interactiveBox" position="0 1.5 -1.5" rotation="0 45 45" color="#00ffcc" interactive-object></a-box>

        <a-sky color="#111111"></a-sky>
    </a-scene>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Box - Hand Tracking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="vr-container">
        <!-- Canvas para captura de câmera -->
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <!-- UI Overlay -->
        <div class="ui-overlay">
            <!-- Status -->
            <div class="status-panel">
                <div id="status" class="status-text">Aguardando câmera...</div>
                <div id="gesture" class="gesture-text">Gesto: Nenhum</div>
                <div id="fps" class="fps-text">FPS: 0</div>
            </div>
            
            <!-- Objetos 3D Interativos -->
            <div class="objects-container">
                <div class="vr-object" id="obj1" data-id="1">
                    Cubo 1
                </div>
                <div class="vr-object" id="obj2" data-id="2">
                    Esfera 2
                </div>
                <div class="vr-object" id="obj3" data-id="3">
                    Pirâmide 3
                </div>
            </div>
            
            <!-- Hand Cursor -->
            <div id="hand-cursor" class="hand-cursor"></div>
            
            <!-- Controles -->
            <div class="controls">
                <button id="toggleMR" class="control-btn">🔄 Toggle AR</button>
                <button id="reset" class="control-btn">🔄 Reset</button>
                <button id="toggleFullscreen" class="control-btn">⛶ Fullscreen</button>
            </div>
            
            <!-- Instruções -->
            <div class="instructions">
                <p>👆 Toque para mover a mão</p>
                <p>✌️ 2 dedos = Pinça (aumentar)</p>
                <p>✊ 3+ dedos = Agarrar (girar)</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="hand-tracker.js"></script>
    <script src="vr-interaction.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreamento de Mão</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #start-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <span id="status-msg">A inicializar a câmara...</span><br>
        <button id="start-btn" onclick="initCamera()">Ativar Câmara</button>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        const startBtn = document.getElementById('start-btn');

        let hands = null;
        let cameraInstance = null;

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || window.innerWidth;
            canvasElement.height = videoElement.videoHeight || window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusMsg.innerText = `Mãos detetadas: ${results.multiHandLandmarks.length}`;
                statusMsg.style.color = '#34d399';

                for (const landmarks of results.multiHandLandmarks) {
                    // Desenha o esqueleto completo da mão
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
                        color: '#38bdf8',
                        lineWidth: 4
                    });
                    drawLandmarks(canvasCtx, landmarks, {
                        color: '#f43f5e',
                        lineWidth: 2,
                        radius: 5
                    });
                }
            } else {
                statusMsg.innerText = "Mostre a sua mão em frente à câmara";
                statusMsg.style.color = '#94a3b8';
            }
            canvasCtx.restore();
        }

        async function initCamera() {
            startBtn.style.display = 'none';
            statusMsg.innerText = "A pedir permissão da câmara...";

            try {
                const constraints = {
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;

                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onResults);

                cameraInstance = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280,
                    height: 720
                });

                await cameraInstance.start();
                statusMsg.innerText = "Câmara ativa. À espera de mãos...";
            } catch (error) {
                console.error("Erro ao iniciar câmara:", error);
                statusMsg.innerText = "Erro ao aceder à câmara. Verifique as permissões.";
                startBtn.style.display = 'inline-block';
            }
        }

        // Tenta iniciar automaticamente ao carregar
        window.addEventListener('DOMContentLoaded', () => {
            initCamera().catch(() => {
                startBtn.style.display = 'inline-block';
                statusMsg.innerText = "Clique para permitir o acesso à câmara.";
            });
        });
    </script>
</body>
</html>
